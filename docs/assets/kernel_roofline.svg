<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Scan kernel rewrite: share of DRAM peak bandwidth</title>
<desc id="d">Before: the block-per-document kernel reached 47, 22, 11 and 2 percent of peak for float32, float16, int8 and binary. After: the persistent warp-per-document kernel reaches 94, 92, 89 and 87 percent.</desc>
<style>
.bg{fill:#fcfcfb}.panel{fill:#f4f3f0;stroke:#e4e3df}.line{stroke:#c9c8c2;fill:none}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#6b6a65}
.blue{fill:#2a78d6}.orange{fill:#eb6834}.gray{fill:#8a8982}.good{fill:#0ca30c}
.arrow{stroke:#52514e;fill:none}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19}.panel{fill:#232321;stroke:#34342f}.line{stroke:#4a4a45}
.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#a09f95}
.blue{fill:#3987e5}.orange{fill:#d95926}.gray{fill:#6b6a65}.good{fill:#0ca30c}
.arrow{stroke:#c3c2b7}}
</style>
<rect class="bg" width="760" height="330" rx="10"/>
<text class="t1" x="24" y="34" font-size="17" font-weight="700" text-anchor="start" >Rewriting the scan kernel: every precision now runs at memory speed</text>
<text class="t2" x="24" y="56" font-size="12.5" font-weight="400" text-anchor="start" >Share of DRAM peak achieved scanning 1M × 384 embeddings · RTX 5060 Ti (448 GB/s) · median of 50 runs</text>
<rect class="orange" x="24" y="72" width="12" height="12" rx="2"/>
<text class="t2" x="42" y="82" font-size="12.5" font-weight="400" text-anchor="start" >v1: one block per document</text>
<rect class="blue" x="230" y="72" width="12" height="12" rx="2"/>
<text class="t2" x="248" y="82" font-size="12.5" font-weight="400" text-anchor="start" >v2: persistent, warp per document, 128-bit loads</text>
<line class="line" x1="96.0" y1="104" x2="96.0" y2="296" stroke-width="1"/>
<text class="t3" x="96.0" y="312" font-size="11" font-weight="400" text-anchor="middle" >0%</text>
<line class="line" x1="202.0" y1="104" x2="202.0" y2="296" stroke-width="1"/>
<text class="t3" x="202.0" y="312" font-size="11" font-weight="400" text-anchor="middle" >25%</text>
<line class="line" x1="308.0" y1="104" x2="308.0" y2="296" stroke-width="1"/>
<text class="t3" x="308.0" y="312" font-size="11" font-weight="400" text-anchor="middle" >50%</text>
<line class="line" x1="414.0" y1="104" x2="414.0" y2="296" stroke-width="1"/>
<text class="t3" x="414.0" y="312" font-size="11" font-weight="400" text-anchor="middle" >75%</text>
<line class="arrow" x1="520.0" y1="100" x2="520.0" y2="296" stroke-width="1" stroke-dasharray="3 3"/>
<text class="t2" x="520.0" y="312" font-size="11" font-weight="400" text-anchor="middle" >100% = peak</text>
<text class="t1" x="84" y="135" font-size="13.5" font-weight="600" text-anchor="end" >float32</text>
<path class="orange" d="M96,110 h195.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-195.3 z"/>
<text class="t2" x="303.28" y="122.5" font-size="11.5" font-weight="400" text-anchor="start" >47% · 7.28 ms</text>
<path class="blue" d="M96,128 h394.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-394.6 z"/>
<text class="t1" x="532" y="140.5" font-size="11.5" font-weight="600" text-anchor="start" >94% · 3.65 ms · 2.0× faster</text>
<text class="t1" x="84" y="181" font-size="13.5" font-weight="600" text-anchor="end" >float16</text>
<path class="orange" d="M96,156 h89.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-89.3 z"/>
<text class="t2" x="197.28" y="168.5" font-size="11.5" font-weight="400" text-anchor="start" >22% · 7.77 ms</text>
<path class="blue" d="M96,174 h386.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-386.1 z"/>
<text class="t1" x="532" y="186.5" font-size="11.5" font-weight="600" text-anchor="start" >92% · 1.87 ms · 4.2× faster</text>
<text class="t1" x="84" y="227" font-size="13.5" font-weight="600" text-anchor="end" >int8</text>
<path class="orange" d="M96,202 h42.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-42.6 z"/>
<text class="t2" x="150.64" y="214.5" font-size="11.5" font-weight="400" text-anchor="start" >11% · 7.94 ms</text>
<path class="blue" d="M96,220 h373.4 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-373.4 z"/>
<text class="t1" x="532" y="232.5" font-size="11.5" font-weight="600" text-anchor="start" >89% · 0.96 ms · 8.3× faster</text>
<text class="t1" x="84" y="273" font-size="13.5" font-weight="600" text-anchor="end" >binary</text>
<path class="orange" d="M96,248 h4.5 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-4.5 z"/>
<text class="t2" x="112.48" y="260.5" font-size="11.5" font-weight="400" text-anchor="start" >2% · 5.42 ms</text>
<path class="blue" d="M96,266 h364.9 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-364.9 z"/>
<text class="t1" x="532" y="278.5" font-size="11.5" font-weight="600" text-anchor="start" >87% · 0.12 ms · 44× faster</text>
</svg>
