<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Scan kernel rewrite: share of DRAM peak bandwidth</title>
<desc id="d">Before: block-per-document kernel reached 47, 22, 11 and 2 percent of peak for float32, float16, int8 and binary. After: persistent warp-per-document kernel reaches 94, 92, 90 and 88 percent.</desc>
<style>.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#7a7974}.grid{stroke:#e4e3df;stroke-width:1}.ref{stroke:#52514e;stroke-width:1;stroke-dasharray:3 3}.before{fill:#eb6834}.after{fill:#2a78d6}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#9a998f}.grid{stroke:#2e2e2c}.ref{stroke:#c3c2b7}.before{fill:#d95926}.after{fill:#3987e5}}</style>
<rect class="bg" width="760" height="330" rx="8"/>
<text class="t1" x="24" y="34" font-size="17" font-weight="600">Rewriting the scan kernel: every precision now runs at memory speed</text>
<text class="t2" x="24" y="56" font-size="13">Share of DRAM peak achieved scanning 1M × 384 embeddings · RTX 5060 Ti (448 GB/s) · median of 50 runs</text>
<rect class="before" x="24" y="72" width="12" height="12" rx="2"/><text class="t2" x="42" y="82" font-size="12.5">v1: one block per document</text>
<rect class="after" x="230" y="72" width="12" height="12" rx="2"/><text class="t2" x="248" y="82" font-size="12.5">v2: persistent, warp per document, 128-bit loads</text>
<line class="grid" x1="96.0" y1="104" x2="96.0" y2="296"/><text class="t3" x="96.0" y="312" font-size="11" text-anchor="middle">0%</text>
<line class="grid" x1="202.0" y1="104" x2="202.0" y2="296"/><text class="t3" x="202.0" y="312" font-size="11" text-anchor="middle">25%</text>
<line class="grid" x1="308.0" y1="104" x2="308.0" y2="296"/><text class="t3" x="308.0" y="312" font-size="11" text-anchor="middle">50%</text>
<line class="grid" x1="414.0" y1="104" x2="414.0" y2="296"/><text class="t3" x="414.0" y="312" font-size="11" text-anchor="middle">75%</text>
<line class="ref" x1="520.0" y1="100" x2="520.0" y2="296"/><text class="t2" x="520.0" y="312" font-size="11" text-anchor="middle">100% = peak</text>
<text class="t1" x="84" y="135" font-size="13.5" font-weight="600" text-anchor="end">float32</text>
<path class="before" d="M96,110 h195.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-195.3 z"/>
<text class="t2" x="302.0" y="122.5" font-size="11.5">47% · 7.28 ms</text>
<path class="after" d="M96,128 h394.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-394.6 z"/>
<text class="t1" x="532" y="140.5" font-size="11.5" font-weight="600">94% · 3.65 ms · 2.0× faster</text>
<text class="t1" x="84" y="181" font-size="13.5" font-weight="600" text-anchor="end">float16</text>
<path class="before" d="M96,156 h89.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-89.3 z"/>
<text class="t2" x="196.0" y="168.5" font-size="11.5">22% · 7.77 ms</text>
<path class="after" d="M96,174 h386.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-386.1 z"/>
<text class="t1" x="532" y="186.5" font-size="11.5" font-weight="600">92% · 1.87 ms · 4.2× faster</text>
<text class="t1" x="84" y="227" font-size="13.5" font-weight="600" text-anchor="end">int8</text>
<path class="before" d="M96,202 h42.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-42.6 z"/>
<text class="t2" x="149.3" y="214.5" font-size="11.5">11% · 7.94 ms</text>
<path class="after" d="M96,220 h377.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-377.6 z"/>
<text class="t1" x="532" y="232.5" font-size="11.5" font-weight="600">90% · 0.96 ms · 8.3× faster</text>
<text class="t1" x="84" y="273" font-size="13.5" font-weight="600" text-anchor="end">binary</text>
<path class="before" d="M96,248 h4.5 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-4.5 z"/>
<text class="t2" x="111.2" y="260.5" font-size="11.5">2% · 5.42 ms</text>
<path class="after" d="M96,266 h369.1 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-369.1 z"/>
<text class="t1" x="532" y="278.5" font-size="11.5" font-weight="600">88% · 0.12 ms · 44× faster</text>
</svg>